[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "literax"
version = "0.1.0"
description = "AI-Powered Academic Research Assistant for SINTA, Scopus, and Global Academic Sources"
readme = "README.md"
authors = [{ name = "Fatir Gibran" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiogram>=3.7.0",
    "httpx[http2]>=0.27.0",
    "rapidfuzz>=3.9.0",
    "nltk>=3.8.1",
    "pymupdf>=1.24.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "redis>=5.0.4",
    "google-generativeai>=0.7.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "tenacity>=8.3.0",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "httpx-mock>=0.3.0",
]

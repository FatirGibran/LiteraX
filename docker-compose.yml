version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: literax_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-literax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-literax_secret}
      POSTGRES_DB: ${POSTGRES_DB:-literax_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-literax} -d ${POSTGRES_DB:-literax_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: literax_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: literax_api
    restart: always
    command: uvicorn literax.api.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-literax}:${POSTGRES_PASSWORD:-literax_secret}@postgres:5432/${POSTGRES_DB:-literax_db}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: literax_bot
    restart: always
    command: python -m literax.bot.main
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-literax}:${POSTGRES_PASSWORD:-literax_secret}@postgres:5432/${POSTGRES_DB:-literax_db}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - api
      - redis
      - postgres

volumes:
  postgres_data:
  redis_data:
